<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Sortie projecteur — VersetLive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Letterbox AD : bleu nuit officiel au lieu de noir pur — discret au projecteur,
       conserve l'identité visuelle dans les bandes hors-image. */
    html, body { width: 100%; height: 100%; background: #131536; overflow: hidden; cursor: none; }
    body { display: flex; align-items: center; justify-content: center; }
    /* En 16:9 natif (pas de bandes), on garde un fond noir pur — plus propre. */
    body[data-aspect="16:9"] { background: #000; }
    /* Le canvas miroir et la vidéo occupent la même place et se comportent
       pareil (letterbox par object-fit). Un seul des deux est visible. */
    video, canvas#mirror {
      width: 100%; height: 100%; object-fit: contain;
      background: transparent;
    }
    body:hover { cursor: default; }

    /* Petit toast d'info détecté (3 s) — identité AD */
    .ratio-toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(19,21,54,0.94);
      color: #FCFCFC;
      border: 1px solid #B38E29;
      padding: 8px 18px;
      border-radius: 6px;
      font: 600 13px -apple-system, "Helvetica Neue", sans-serif;
      letter-spacing: 0.05em;
      box-shadow: 0 6px 22px rgba(0,0,0,0.55);
      z-index: 50;
      opacity: 0;
      transition: opacity 0.35s;
      pointer-events: none;
      white-space: nowrap;
    }
    .ratio-toast.show { opacity: 1; }
    .ratio-toast .ratio-pill {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 8px;
      background: #B38E29;
      color: #131536;
      border-radius: 999px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body data-aspect="16:9">
  <video id="output" autoplay playsinline></video>
  <canvas id="mirror" width="1920" height="1080" hidden></canvas>
  <iframe id="iframeOverlay" hidden allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
    style="position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; z-index:10;"></iframe>
  <div class="ratio-toast" id="ratioToast" aria-hidden="true"></div>

  <script>
    const video = document.getElementById('output');
    const mirror = document.getElementById('mirror');
    const mctx = mirror.getContext('2d', { alpha: false });
    const iframeOverlay = document.getElementById('iframeOverlay');

    // ====== Chemin faible latence : recopie directe du canvas du Studio ======
    // Le Studio nous passe SON canvas programme. Même origine + fenêtre ouverte
    // par lui ⇒ même processus de rendu : drawImage reste une copie GPU, sans
    // passer par captureStream ni par un élément <video>. On économise ainsi les
    // 2 à 4 images de tampon d'un flux média (~70 à 130 ms au projecteur) et le
    // ré-échantillonnage qui hachait les mouvements.
    // La balise <video> reste en place, mais ne sert plus qu'à l'AUDIO : la
    // fenêtre projecteur est parfois la sortie son de la salle.
    let mirrorSrc = null;
    let mirrorRaf = 0;

    function attachAudioOnly(stream) {
      const next = (stream && stream.getAudioTracks) ? (stream.getAudioTracks()[0] || null) : null;
      const cur = (video.srcObject && video.srcObject.getAudioTracks)
        ? (video.srcObject.getAudioTracks()[0] || null) : null;
      if (next === cur) return;              // rien à faire : pas de coupure son
      video.srcObject = stream || null;
      if (stream) video.play().catch(() => {});
    }

    function mirrorDraw() {
      const src = mirrorSrc;
      if (!src || !src.width || !src.height) return;
      try {
        if (mirror.width !== src.width || mirror.height !== src.height) {
          mirror.width = src.width;
          mirror.height = src.height;
        }
        mctx.drawImage(src, 0, 0);
      } catch (e) {
        // Canvas devenu inaccessible (Studio rechargé, fenêtre détachée) :
        // on repasse au flux média plutôt que de laisser l'écran figé.
        console.warn('[Projecteur] recopie directe interrompue → repli flux', e);
        cancelAnimationFrame(mirrorRaf); mirrorRaf = 0; mirrorSrc = null;
        mirror.hidden = true; video.hidden = false;
        try {
          if (window.opener && !window.opener.closed && window.opener.projectorNeedsStream) {
            window.opener.projectorNeedsStream();
          }
        } catch (e2) {}
      }
    }

    function mirrorLoop() {
      mirrorRaf = requestAnimationFrame(mirrorLoop);
      mirrorDraw();
    }

    // Filet anti-gel. Contrairement à une balise <video>, un canvas recopié ne
    // se rafraîchit que si NOTRE boucle tourne : si le navigateur considère
    // cette fenêtre comme masquée (autre bureau macOS, fenêtre recouverte), il
    // gèle requestAnimationFrame et la projection resterait sur la dernière
    // image. Un tick porté par un Web Worker échappe au throttling agressif des
    // pages en arrière-plan et prend le relais — même parade que le Studio et la
    // page caméra. Repli sur un setInterval si les workers sont indisponibles.
    setInterval(() => { if (document.hidden && mirrorSrc) mirrorDraw(); }, 33);
    try {
      const workerSrc = 'var h=null;onmessage=function(e){var ms=(e.data&&e.data.ms)||33;'
        + 'if(h)clearInterval(h);h=setInterval(function(){postMessage(1);},ms);};';
      const workerUrl = URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' }));
      const mirrorWorker = new Worker(workerUrl);
      mirrorWorker.onmessage = () => { if (document.hidden && mirrorSrc) mirrorDraw(); };
      mirrorWorker.postMessage({ ms: 33 });
    } catch (e) { /* pas de worker : le setInterval ci-dessus assure le repli */ }

    // Appelé par studio.js. Renvoie true si la recopie directe est en place.
    window.setProgramSource = function (canvas, audioStream) {
      if (!canvas || !canvas.width || typeof canvas.getContext !== 'function') return false;
      mirrorSrc = canvas;
      attachAudioOnly(audioStream);
      video.hidden = true;     // display:none — l'audio continue de jouer
      mirror.hidden = false;
      if (!mirrorRaf) mirrorRaf = requestAnimationFrame(mirrorLoop);
      return true;
    };

    // Appelé par la fenêtre parente (studio.js). On évite de réassigner srcObject
    // si c'est déjà le même flux : ça causait un saut/flicker à chaque toggle
    // audio/record/stream côté studio. La projection reste continue.
    window.setProgramStream = function (stream) {
      // Repli : image ET son par le flux média. Coupe la recopie directe si elle
      // tournait, sinon les deux se superposeraient.
      if (mirrorRaf) { cancelAnimationFrame(mirrorRaf); mirrorRaf = 0; }
      mirrorSrc = null;
      mirror.hidden = true;
      video.hidden = false;
      if (video.srcObject === stream) return;
      video.srcObject = stream;
      video.play().catch(() => {});
    };

    // Mode iframe (YouTube/Vimeo) : superpose un lecteur tiers par-dessus le canvas.
    // Appelé par studio.js quand on bascule sur une scène { kind: 'iframe', url }.
    window.setIframeUrl = function (url) {
      if (!url) { window.clearIframe(); return; }
      if (iframeOverlay.src !== url) iframeOverlay.src = url;
      iframeOverlay.hidden = false;
    };
    window.clearIframe = function () {
      iframeOverlay.hidden = true;
      // Reset src pour stopper l'audio/vidéo de la plateforme externe.
      if (iframeOverlay.src) iframeOverlay.src = 'about:blank';
    };

    // ============= Auto-adaptation au ratio du projecteur =============
    // Ratios standards reconnus. On choisit le plus proche logarithmiquement
    // (insensible au sens des écarts) pour tolérer ±1-2 % d'arrondi pixel.
    const KNOWN_RATIOS = [
      { name: '32:9', ratio: 32 / 9 },
      { name: '21:9', ratio: 21 / 9 },
      { name: '16:9', ratio: 16 / 9 },
      { name: '16:10', ratio: 16 / 10 },
      { name: '3:2',  ratio: 3 / 2 },
      { name: '4:3',  ratio: 4 / 3 },
      { name: '5:4',  ratio: 5 / 4 },
      { name: '1:1',  ratio: 1 },
      { name: '9:16', ratio: 9 / 16 },
    ];

    function classifyAspect() {
      const w = window.innerWidth, h = window.innerHeight;
      if (!w || !h) return null;
      const r = w / h;
      let best = KNOWN_RATIOS[0], bestDelta = Infinity;
      for (const it of KNOWN_RATIOS) {
        const d = Math.abs(Math.log(r / it.ratio));
        if (d < bestDelta) { bestDelta = d; best = it; }
      }
      // Si l'écart au plus proche dépasse ~5 %, on garde la valeur mais on signale "non-standard"
      const standard = bestDelta < 0.05;
      return { name: best.name, ratio: best.ratio, actual: r, w, h, standard };
    }

    let lastSignature = null;
    function applyAspect() {
      const a = classifyAspect();
      if (!a) return;
      const sig = `${a.w}x${a.h}/${a.name}`;
      if (sig === lastSignature) return;
      lastSignature = sig;

      document.body.dataset.aspect = a.name;
      document.body.style.setProperty('--proj-aspect-ratio', String(a.actual));

      // Toast
      const t = document.getElementById('ratioToast');
      if (t) {
        const label = a.standard ? a.name : (a.name + ' approx.');
        t.innerHTML = `Projecteur détecté : <strong>${a.w}×${a.h}</strong> <span class="ratio-pill">${label}</span>`;
        t.classList.add('show');
        clearTimeout(applyAspect._toastTimer);
        applyAspect._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
      }

      // Notifier le studio parent (callback optionnel)
      try {
        if (window.opener && !window.opener.closed) {
          if (typeof window.opener.onProjectorAspectChange === 'function') {
            window.opener.onProjectorAspectChange(a);
          }
        }
      } catch {}
    }

    window.addEventListener('resize', applyAspect);
    document.addEventListener('fullscreenchange', applyAspect);
    // Premier passage après le layout initial
    requestAnimationFrame(applyAspect);

    // Permettre au studio de redemander la détection (ex: après un déplacement entre écrans)
    window.detectProjectorAspect = function () { lastSignature = null; applyAspect(); return classifyAspect(); };

    // F11 pour plein écran (Mac : Cmd+Ctrl+F)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11' || (e.key === 'f' && (e.metaKey || e.ctrlKey))) {
        e.preventDefault();
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
      if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
    });

    // Si la fenêtre parente est fermée, on se ferme aussi
    setInterval(() => {
      if (!window.opener || window.opener.closed) window.close();
    }, 2000);
  </script>
  <!-- Écran de sortie : pas de rechargement auto ni bannière (silencieux). -->
  <script>window.VL_NO_AUTORELOAD = true;</script>
  <script src="/sw-register.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
